<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Left fist (pointing right) -->
  <g fill="white">
    <!-- Arm/wrist -->
    <rect x="24" y="295" width="125" height="75" rx="16"/>
    <!-- Main fist body -->
    <rect x="18" y="205" width="215" height="108" rx="26"/>
    <!-- Knuckles -->
    <rect x="34"  y="168" width="43" height="55" rx="14"/>
    <rect x="86"  y="159" width="43" height="64" rx="14"/>
    <rect x="138" y="162" width="43" height="61" rx="14"/>
    <rect x="186" y="171" width="37" height="52" rx="13"/>
    <!-- Thumb -->
    <rect x="18" y="298" width="58" height="36" rx="12"/>
  </g>

  <!-- Right fist (mirror of left, pointing left) -->
  <g fill="white" transform="translate(512,0) scale(-1,1)">
    <!-- Arm/wrist -->
    <rect x="24" y="295" width="125" height="75" rx="16"/>
    <!-- Main fist body -->
    <rect x="18" y="205" width="215" height="108" rx="26"/>
    <!-- Knuckles -->
    <rect x="34"  y="168" width="43" height="55" rx="14"/>
    <rect x="86"  y="159" width="43" height="64" rx="14"/>
    <rect x="138" y="162" width="43" height="61" rx="14"/>
    <rect x="186" y="171" width="37" height="52" rx="13"/>
    <!-- Thumb -->
    <rect x="18" y="298" width="58" height="36" rx="12"/>
  </g>

  <!-- Impact star at centre -->
  <polygon
    points="256,118 263,142 288,142 268,157 276,181 256,166 236,181 244,157 224,142 249,142"
    fill="#F9F871"
  />
</svg>
